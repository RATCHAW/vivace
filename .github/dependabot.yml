version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      non-major-dependencies:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  # docker-compose.yml pins images by digest; the docker ecosystem only reads
  # Dockerfiles, so the compose file needs its own entry.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7

  - package-ecosystem: docker
    directory: /apps/api
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7

  - package-ecosystem: docker
    directory: /apps/web
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7

  - package-ecosystem: docker
    directory: /apps/landing
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
