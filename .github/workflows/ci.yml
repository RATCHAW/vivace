name: CI

on:
  pull_request:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Nothing here needs pnpm or a database — it reads the diff, so it finishes in
  # seconds and reports the migration problem long before `validate` is done.
  # Skipped in a merge queue, where there is no pull request to compare against.
  migrations:
    name: Migration history
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The script diffs base against head, and neither commit is reachable
          # from a shallow clone of the other.
          fetch-depth: 0

      - name: Ensure at most one new migration
        run: |
          bash scripts/check-new-migrations.sh \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}"

  validate:
    name: Lint, typecheck, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The pre-commit hook runs these on staged files only, and --no-verify
      # exists — so the whole tree is checked here rather than assumed.
      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Check the Remotion bundle
        run: pnpm --filter @repo/video run bundle:check

  # A separate job because it is the only one that needs a database and a
  # browser, and because it is the only one whose failure says something about
  # the app rather than about the code. It boots the real API and the real Vite
  # app against a Strava the suite owns — see apps/e2e/fake-strava.ts.
  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        # Pinned by digest, and to the same one docker-compose.yml runs locally:
        # zizmor fails an unpinned image, and a suite that passes here against a
        # different Postgres than the one on your machine is worth less than the
        # minutes it costs. Bump both together.
        image: postgres:18-alpine@sha256:a1d02e4bd40c94d3bf2bdd3678c137388e76d9efcd23c285e9429d336a834b44
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports:
          # The port apps/e2e/env.ts defaults to, so nothing has to be told.
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    steps:
      - name: Check out the pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Chromium only — the suite has one project, and pulling three browsers
      # would cost more than the tests do.
      - name: Install Chromium
        run: pnpm --filter @repo/e2e exec playwright install --with-deps chromium

      - name: Run the end-to-end suite
        run: pnpm e2e

      # The trace is the thing worth having when this fails on somebody else's
      # machine: it replays the run frame by frame with the network attached.
      - name: Upload the report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: apps/e2e/playwright-report/
          retention-days: 7
