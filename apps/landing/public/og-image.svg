<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- This file is the source; og-image.png is what crawlers fetch. Editing one
       without the other ships a social card that contradicts the page, so:
         rsvg-convert -w 1200 -h 630 og-image.svg -o og-image.png
       What it shows has to stay what `meta.imageAlt` says it shows — a test in
       src/i18n/i18n.test.ts fails if that description drops either product. -->
  <title>Vivace — an AI running coach and shareable run replays from Strava</title>
  <rect width="1200" height="630" fill="#000"/>
  <path d="M0 126H1200M0 252H1200M0 378H1200M0 504H1200M200 0V630M400 0V630M600 0V630M800 0V630M1000 0V630" stroke="#fff" stroke-opacity=".055"/>

  <g transform="translate(64 56)">
    <rect width="52" height="52" rx="11.44" fill="#494fdf"/>
    <g transform="translate(26 26) scale(1.56) translate(-12 -12)">
      <path d="M6.208 2.077 22 14.415 3.419 21.923 2 18.412 20.611 14.22 3.876 5.061Z" fill="#fff"/>
    </g>
    <text x="70" y="39" fill="#fff" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="650" letter-spacing="-1">vivace</text>
  </g>

  <text x="64" y="236" fill="#8d969e" font-family="JetBrains Mono, Menlo, monospace" font-size="18" font-weight="600" letter-spacing="2.8">AI COACH · RUN REPLAYS</text>
  <text x="64" y="310" fill="#fff" font-family="Inter, Arial, sans-serif" font-size="58" font-weight="560" letter-spacing="-2">AI coach for every run.</text>
  <text x="64" y="376" fill="#fff" font-family="Inter, Arial, sans-serif" font-size="58" font-weight="560" letter-spacing="-2">Replays made to share.</text>
  <text x="67" y="440" fill="#b7bdc2" font-family="Inter, Arial, sans-serif" font-size="24">Grounded in your Strava history · 9:16 MP4</text>

  <g transform="translate(800 79)">
    <rect width="336" height="206" rx="34" fill="#16181a" stroke="#fff" stroke-opacity=".14"/>
    <text x="26" y="42" fill="#8d969e" font-family="JetBrains Mono, Menlo, monospace" font-size="13" font-weight="600" letter-spacing="2.4">AI COACH</text>
    <rect x="76" y="58" width="234" height="42" rx="15" fill="#494fdf"/>
    <text x="94" y="85" fill="#fff" font-family="Inter, Arial, sans-serif" font-size="16">Half marathon in October.</text>
    <rect x="26" y="112" width="262" height="64" rx="15" fill="#202326" stroke="#fff" stroke-opacity=".12"/>
    <text x="44" y="138" fill="#fff" font-family="Inter, Arial, sans-serif" font-size="16">Long run Sunday:</text>
    <text x="44" y="161" fill="#fff" font-family="Inter, Arial, sans-serif" font-size="16">14 km at 6:05 /km.</text>
  </g>

  <g transform="translate(800 311)">
    <rect width="336" height="240" rx="34" fill="#16181a" stroke="#fff" stroke-opacity=".14"/>
    <text x="26" y="40" fill="#8d969e" font-family="JetBrains Mono, Menlo, monospace" font-size="13" font-weight="600" letter-spacing="2.4">RUN REPLAY</text>
    <path d="M56 74C28 106 46 134 84 144C122 154 100 178 136 190C148 194 158 194 164 190" fill="none" stroke="#4f55f1" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="56" cy="74" r="8" fill="#fff"/>
    <circle cx="164" cy="190" r="11" fill="#4f55f1" stroke="#fff" stroke-width="5"/>
    <g fill="#fff" font-family="Inter, Arial, sans-serif">
      <text x="206" y="120" font-size="12" font-weight="650" opacity=".6">DISTANCE</text>
      <text x="206" y="148" font-size="23" font-weight="600">10.24 km</text>
      <text x="206" y="186" font-size="12" font-weight="650" opacity=".6">PACE</text>
      <text x="206" y="214" font-size="23" font-weight="600">5:12 /km</text>
    </g>
  </g>
</svg>
