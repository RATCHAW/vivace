server {
  listen 80;
  server_tokens off;
  root /usr/share/nginx/html;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    # Replace, rather than append to, a caller-supplied forwarding header.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # A hashed chunk is either on disk or gone with the deploy that built it, and
  # is never the SPA shell. Falling through would answer a stale chunk with
  # `200 text/html`, which no browser will parse as a module — the crash the
  # reload in src/lib/stale-chunk.ts recovers from.
  location /assets/ {
    try_files $uri =404;
  }

  # That reload only helps if the document itself is refetched, so the shell
  # must never be served from cache. `expires` rather than `add_header`: a
  # location that sets one add_header inherits none of those above.
  location = /index.html {
    expires -1;
  }

  location / {
    try_files $uri /index.html;
  }
}
