services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      # Host port 5433 to avoid clashing with any local Postgres on 5432
      - "5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Log storage. Started by both profiles, because the API pushes to it
  # directly — there is no agent scraping container stdout.
  loki:
    profiles: ["app", "observability"]
    image: grafana/loki:3.7
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ./ops/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki-data:/loki
    ports:
      # Exposed so `pnpm dev` on the host can push to it too
      - "3100:3100"
    # No healthcheck: the image is distroless — no shell, no wget, so every
    # form of `test:` fails and the container reads as unhealthy forever.
    # Nothing waits on Loki anyway; the API batches and retries its pushes.
    # Readiness by hand: curl http://localhost:3100/ready

  # The dashboards live in ops/grafana and are provisioned on startup, so this
  # comes up already pointed at Loki with both boards loaded.
  grafana:
    profiles: ["app", "observability"]
    image: grafana/grafana:13.1
    environment:
      # Local-only convenience: no login wall in front of the dashboards.
      # Put Grafana behind real auth before exposing it anywhere else.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_DEFAULT_THEME: dark
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      # 3000 is the API and 3001 the landing page
      - "3002:3000"
    depends_on:
      - loki

  api:
    profiles: ["app"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgres://app:app@db:5432/app
      BETTER_AUTH_URL: http://localhost:3000
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      WEB_ORIGIN: http://localhost:8080
      STRAVA_CLIENT_ID: ${STRAVA_CLIENT_ID:-}
      STRAVA_CLIENT_SECRET: ${STRAVA_CLIENT_SECRET:-}
      # Unset just means the coach answers 503; the rest of the app is fine.
      GOOGLE_GENERATIVE_AI_API_KEY: ${GOOGLE_GENERATIVE_AI_API_KEY:-}
      COACH_MODEL: ${COACH_MODEL:-}
      # Unset means the Strava webhook refuses to validate, so no automatic
      # post-run debriefs. Everything else is unaffected.
      STRAVA_WEBHOOK_VERIFY_TOKEN: ${STRAVA_WEBHOOK_VERIFY_TOKEN:-}
      # Logs go to stdout and to Loki; unset this to keep them on stdout only.
      LOKI_URL: ${LOKI_URL-http://loki:3100}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      APP_ENV: ${APP_ENV:-docker}
      # Product analytics, error tracking and feature flags. Unset means the
      # API runs exactly as before, minus the reporting.
      POSTHOG_KEY: ${POSTHOG_KEY:-}
      POSTHOG_HOST: ${POSTHOG_HOST:-}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      loki:
        condition: service_started

  web:
    profiles: ["app"]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Inlined into the bundle at build time, not read at runtime
        VITE_POSTHOG_KEY: ${VITE_POSTHOG_KEY:-}
        VITE_POSTHOG_HOST: ${VITE_POSTHOG_HOST:-}
    ports:
      - "8080:80"
    depends_on:
      - api

  landing:
    profiles: ["app"]
    build:
      context: .
      dockerfile: apps/landing/Dockerfile
      args:
        # Baked into the bundle at build time — where "Connect Strava" goes
        NEXT_PUBLIC_APP_URL: http://localhost:8080
        NEXT_PUBLIC_POSTHOG_KEY: ${NEXT_PUBLIC_POSTHOG_KEY:-}
        NEXT_PUBLIC_POSTHOG_HOST: ${NEXT_PUBLIC_POSTHOG_HOST:-}
    ports:
      - "3001:3001"

volumes:
  db-data:
  loki-data:
  grafana-data:
